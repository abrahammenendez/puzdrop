name: Daily puzdrop

on:
  schedule:
    - cron: '51 3 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch (YYYY-MM-DD). Empty for today.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  daily-puzdrop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Mask configuration values
        # Actions redacts secrets from logs automatically, but not variables,
        # so register these two as masks explicitly.
        env:
          URL_TEMPLATE: ${{ vars.PUZZLE_API_URL_TEMPLATE }}
          ORIGIN: ${{ vars.PUZZLE_API_ORIGIN }}
        run: |
          echo "::add-mask::$URL_TEMPLATE"
          echo "::add-mask::$ORIGIN"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install --group dev

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      - name: Fetch and convert puzzle
        id: fetch
        env:
          PUZZLE_API_URL_TEMPLATE: ${{ vars.PUZZLE_API_URL_TEMPLATE }}
          PUZZLE_API_ORIGIN: ${{ vars.PUZZLE_API_ORIGIN }}
          PUZZLE_TITLE: ${{ vars.PUZZLE_TITLE }}
          PUZZLE_FILE_PREFIX: ${{ vars.PUZZLE_FILE_PREFIX }}
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            path=$(python fetch.py --date "$REQUESTED_DATE")
          else
            path=$(python fetch.py)
          fi
          name=$(basename "$path" .puz)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          # The date is the trailing YYYY-MM-DD, after any configured prefix.
          echo "date=${name: -10}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          # Uploads the .puz as-is instead of wrapping it in a zip. The
          # artifact takes its name from the file, so `name` is ignored.
          archive: false
          path: ${{ steps.fetch.outputs.path }}
          retention-days: 1
          if-no-files-found: error

      # Runs after the upload, so the artifact is already there to fall back on
      # if Telegram is the thing that broke.
      - name: Deliver
        id: deliver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          PUZZLE_PATH: ${{ steps.fetch.outputs.path }}
          PUZZLE_DATE: ${{ steps.fetch.outputs.date }}
        run: |
          {
            echo "## $PUZZLE_DATE"
            echo
            python notify.py --file "$PUZZLE_PATH" --date "$PUZZLE_DATE"
          } >> "$GITHUB_STEP_SUMMARY"

      # Delivery is what writes the summary, so a failure before it would leave
      # the run with none. A delivery failure already reported itself above.
      - name: Report a failure before delivery
        if: failure() && steps.deliver.outcome != 'failure'
        run: |
          echo "❌ The run failed before delivery; there is no puzzle today." \
            >> "$GITHUB_STEP_SUMMARY"
